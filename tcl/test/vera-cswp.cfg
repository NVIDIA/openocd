#
# Test if Vera's CSWP interface is working.
# Do NOT source interface/cswp.cfg here - it shoudl be loaded via -f on the
# command line.

if { [info exists CSWP_SERVER_TCPID] } {
    cswp new cswpif -tcp $CSWP_SERVER_TCPID
} else {
    if { ! [info exists CSWP_SERVER_USBID] } {
        set CSWP_SERVER_USBID "0955:7410"
    }
    cswp new cswpif -usb $CSWP_SERVER_USBID
}

target create cswp.apb mem_ap -cswp cswpif -ap-num 0

# Check CSWP interface can be started
if { [catch {init} err] } {
    puts "Vera CSWP pre-check: init failed: $err"
    shutdown error
}

if { [catch {cswp status cswpif} output] } {
    puts "Vera CSWP pre-check: status failed:"
    puts "$output"
    shutdown error
}
puts "$output"

# Check APB connectivity to check Debug is enabled.
if { [catch {set _PIDR0 [cswp.apb read_memory 0x800fe0 32 1]} err] } {
    puts "Vera CSWP pre-check: APBROM PIDR0 read failed (DEVICEEN off?): $err"
    shutdown error
}

if { $_PIDR0 != 0x14 } {
    puts "Vera CSWP pre-check: APBROM PIDR0 read invalid: $_PIDR0"
    shutdown error
}

shutdown
