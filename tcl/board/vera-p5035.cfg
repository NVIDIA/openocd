# OpenOCD Board Configuration for nVidia Vera C2GRS system
set BOARD_NAME p5035

# Argument Description
#
# JTAGFREQ (JTAG connections only)
# Select non-standard clock frequency
# Syntax: -c "set JTAGFREQ freq_in_khz"
#

# STRAPS_DIESEL (JTAG connections only)
# If set can be used to indicate the DIE_SEL board straps value currently set.
#		-If 7 then all memory + system die are daisy-chained together.
#		-If 0 then only the system die JTAG is attached, all memory dies are bypassed.
# Default is STRAPS_DIESEL=0
if { ! [info exists STRAPS_DIESEL] } {
	set STRAPS_DIESEL 7
}

# GPIO_BYPASS (JTAG connections only)
# If set can be used to indicate the GPIO JTAG bypass setting currently in use:
#		-MCU_JTAG_BYPASS_CPU0-O: if 1 chiplet 0 C dielet is bypassed.
#		-MCU_JTAG_BYPASS_CPU0_S-O: if 1 chiplet 0 S and Mem dielets are bypassed.
#		-MCU_JTAG_BYPASS_CPU1-O: if 1 chiplet 1 C dielet is bypassed.
#		-MCU_JTAG_BYPASS_CPU1_S-O: if 1 chiplet 1 S and Mem dielets are bypassed.
# You should set variable GPIO_BYPASS to:
# 	gpioget `gpiofind MCU_JTAG_BYPASS_CPU0-O` << 0
# 	| gpioget `gpiofind MCU_JTAG_BYPASS_CPU0_S-O` << 1
# 	| gpioget `gpiofind MCU_JTAG_BYPASS_CPU1-O` << 2
# 	| gpioget `gpiofind MCU_JTAG_BYPASS_CPU1_S-O` << 3
# Default is GPIO_BYPASS=0x5 (both chiplets s dielet on JTAG chain)
if { ! [info exists GPIO_BYPASS] } {
	set GPIO_BYPASS 0x5
}

source [find target/vera.cfg]

if { [transport select] ne "cswp" } {
	if { (${GPIO_BYPASS} == 0xe) || (${GPIO_BYPASS} == 0xd)
				 || (${GPIO_BYPASS} == 0xb) || (${GPIO_BYPASS} == 0x7) } {
		set MAXJTAGFREQ 5000
	} else {
		# When the chain is too long we must reduce the speed
		set MAXJTAGFREQ 2500
	}
	if { (${GPIO_BYPASS} == 0x5) || (${GPIO_BYPASS} == 0xa) } {
		# Disable C2C in configs where both chiplets are connected
		set USE_C2C 0
	}

	jtag_basic_init ${MAXJTAGFREQ}

	#
	# Create TAPs, on P5035 we have a 4-long daisy chain: C0 + S0 + C1 + S1
	#
	if { (${GPIO_BYPASS} & 0x8) == 0 } {
		jtag_instantiate system 1 $STRAPS_DIESEL
	}
	if { (${GPIO_BYPASS} & 0x4) == 0 } {
		jtag_instantiate compute 1 $STRAPS_DIESEL
	}
	if { (${GPIO_BYPASS} & 0x2) == 0 } {
		jtag_instantiate system 0 $STRAPS_DIESEL
	}
	if { (${GPIO_BYPASS} & 0x1) == 0 } {
		jtag_instantiate compute 0 $STRAPS_DIESEL
	}
}

# Configure OpenOCD for a 2 chiplets system
vera_board_configure 2

# Setup and attach
vera_board_init
