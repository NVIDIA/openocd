# OpenOCD Target Configuration for nVidia Vera Super Chip

# This file consumes the following configuration variables:
# CSWP_SERVER_USBID: CSWP USB device to look for (<vid>:<pid>[:[<serial>][:<speedid>]])
# CSWP_SERVER_TCPID: if defined then the CSWP client will use TCP instead of USB
# to connect to the CSWP server, syntax is "<ip>:<port>".
# BOARD_NAME: this variable must be set to the board name.
#
# The user can also set the following settings to affect how OpenOCD is configured:
# USE_C2C: if set the C2C link is used to communicate with chiplet 1, otherwise
# we use a separate JTAG/CSWP connection. Default is 1.
# SYSNAME: override the prefix used when naming targets created by this file.
# Default is "vera".
# CSWP_SERVER_USBID
# CSWP_SERVER_TCPID
# GDB_FIRST_PORT
# GDB ports:
# $GDB_FIRST_PORT: main GDB access port for ccplex cores
# $GDB_FIRST_PORT+2+$chiplet_id: AXI $chiplet_id access port
# JTAG_ADAPTER_SERIAL: serial ID of the JTAG adapter. This is optional.
# POWER_UP_DEBUG: if set (default) the cores DBGPCR PR bit will be set to force
# core power to be applied.
# DEBUG_MAX_NUM_CORES: Debug only - Limit (or increase) the number of cores per
# socket.

set VERATAPID 0x5ba06477

if { ! [info exists BOARD_NAME] } {
	error "BOARD_NAME is not set, it must be set before calling vera.cfg"
}

if { ! [info exists SYSNAME] } {
	set SYSNAME vera
}

if { ! [info exists USE_C2C] } {
	set USE_C2C 1
}

if { ! [info exists CSWP_SERVER_USBID] } {
	set CSWP_SERVER_USBID "0955:7410"
}

if { ! [info exists GDB_FIRST_PORT] } {
	set GDB_FIRST_PORT 10000
}

if { ! [info exists POWER_UP_DEBUG] } {
	set POWER_UP_DEBUG 1
}

if { ! [info exists DEBUG_MAX_NUM_CORES] } {
	set DEBUG_MAX_NUM_CORES 98
}

# Global WDT freeze-request register (fixed SOC fabric address). Writing 1
# freezes ALL watchdog timers on the SOC, so halting a core in debug cannot let
# a watchdog reset the SOC.
set WDT_FREEZE_REQ_ADDR 0xFE15003C2050

set CCPLEX_CORES_LIST {}
set WDT_FREEZE_REGS {}

################
# FUNCTIONS: these should be called by the board file at the appropriate
# moment.
################

# Instantiate all the Coresight facilities in the target for a specific chiplet
proc vera_instantiate { chiplet_id } {
	global SYSNAME
	global CSWP_SERVER_USBID
	global CSWP_SERVER_TCPID
	global BOARD_NAME
	global GDB_FIRST_PORT
	global CCPLEX_CORES_LIST
	global USE_C2C
	global POWER_UP_DEBUG
	global WDT_FREEZE_REQ_ADDR
	global WDT_FREEZE_REGS
	global DEBUG_MAX_NUM_CORES

	if { ($USE_C2C == 0) || ($chiplet_id == 0) } {
		set _TARGETNAME $SYSNAME.$chiplet_id

		if { [transport select] eq "cswp" } {
			#
			# Configure CSWP connections
			#
			if { [info exists CSWP_SERVER_TCPID] } {
				cswp new $BOARD_NAME.$chiplet_id.cswp -tcp $CSWP_SERVER_TCPID
			} else {
				cswp new $BOARD_NAME.$chiplet_id.cswp -usb $CSWP_SERVER_USBID
			}

			#
			# Create MEM-AP targets for each Access Port (ap-num No to CSWP device No)
			#
			target create $_TARGETNAME.apb  mem_ap -cswp $BOARD_NAME.$chiplet_id.cswp -ap-num 0
			target create $_TARGETNAME.axi  mem_ap -cswp $BOARD_NAME.$chiplet_id.cswp -ap-num 1 -gdb-port [expr {$GDB_FIRST_PORT+2+$chiplet_id}]
			target create $_TARGETNAME.ctlp mem_ap -cswp $BOARD_NAME.$chiplet_id.cswp -ap-num 2

			#
			# Check CSWP status
			#
			cswp status $BOARD_NAME.$chiplet_id.cswp

			if { [info exists CSWP_SERVER_TCPID] } {
				echo "Vera $chiplet_id CSWP configuration is complete, attached to TCP address $CSWP_SERVER_TCPID."
			} else {
				echo "Vera $chiplet_id CSWP configuration is complete, attached to USB device $CSWP_SERVER_USBID."
			}
		} else {
			#
			# Configure JTAG TAPs - TAP chain declaration order is important
			#

			# Tested up to 5MHz
			set JTAG_SPEED_STR [adapter speed]
			regsub {^adapter speed: ([0-9]+) kHz.*} "$JTAG_SPEED_STR" {\1} JTAG_SPEED
			if { $JTAG_SPEED <= 500 } {
				set MEMACCESS 1
			} elseif { $JTAG_SPEED <= 5000 } {
				set MEMACCESS 50
			} else {
				set MEMACCESS 100
			}
			echo "JTAG speed used to configure memaccess is ${JTAG_SPEED}kHz => memaccess=${MEMACCESS}TCK"
			# Make sure the JTAG config is sane
			if { [lsearch -exact "[dap names]" $BOARD_NAME.$chiplet_id.s.dap] < 0 } {
				error "No dap named $BOARD_NAME.$chiplet_id.s.dap found, check JTAG board configuration, GPIO_BYPASS and mux selects."
			}

			# Create the DAP APB-AP MEM-AP target for the ARMV8 cores
			target create $_TARGETNAME.apb mem_ap -dap $BOARD_NAME.$chiplet_id.s.dap -ap-num 0x2000 -memaccess $MEMACCESS

			# Create the DAP AXI-AP MEM-AP target for the ARMV8 cores
			# We use the same memaccess setting as APB because of the AXI2APB bridge which has the same speed restrictions
			target create $_TARGETNAME.axi mem_ap -dap $BOARD_NAME.$chiplet_id.s.dap -ap-num 0x4000 -gdb-port [expr {$GDB_FIRST_PORT+2+$chiplet_id}] -memaccess $MEMACCESS

			# Set CSW register value default correctly for AXI accessible device memory:
			# Select the correct Access Port Number
			$BOARD_NAME.$chiplet_id.s.dap apsel 0x4000
			# Set the CSW to OpenOCD's internal default
			$BOARD_NAME.$chiplet_id.s.dap apcsw default
		}

		# Use the APB we just created
		set _SOCKET_OFFSET 0
		set _APB_OFFSET 0
		set _APBBUSTGT $_TARGETNAME.apb
		lappend WDT_FREEZE_REGS [list $chiplet_id $_TARGETNAME.axi $WDT_FREEZE_REQ_ADDR]
	} else {
		if { [transport select] eq "cswp" } {
			# CSWP implements multi-chiplet using a 64b APB
			set _APB_OFFSET 0
			set _APBBUSTGT $SYSNAME.0.apb
		} else {
			# Our APB bus is only 32b thus if we don't have a direct connection
			# on the board we must use MMIO
			set _APB_OFFSET 0xfe1410000000
			set _APBBUSTGT $SYSNAME.0.axi
		}
		set _SOCKET_OFFSET [expr {$chiplet_id*0x4000000000}]
		lappend WDT_FREEZE_REGS [list $chiplet_id $SYSNAME.0.axi [expr {$WDT_FREEZE_REQ_ADDR + $_SOCKET_OFFSET}]]
	}

	#
	# Configure target CPUs
	#

	set _CURRENT_CORE [expr {$chiplet_id*98}]

	for {set coreid 0} {$coreid < $DEBUG_MAX_NUM_CORES} {incr coreid} {
		if { [is_shutdown_pending] } {
			echo "OpenOCD is shutting down, skipping core $coreid initialization."
			return
		}

		# Skip cores that are always floorswept
		if { ($coreid == 1)
					|| ($coreid == 3)
					|| ($coreid == 5)
					|| ($coreid == 7)
					|| ($coreid == 9)
					|| ($coreid == 11)
					|| ($coreid == 13) } {
			echo "Core $_CURRENT_CORE floorswept."
			incr _CURRENT_CORE
			continue
		}

		# Format a string to reference which CPU target to use
		set _CORENAME $SYSNAME.core$_CURRENT_CORE
		set _CTINAME $SYSNAME.cti$_CURRENT_CORE

		set _core_offset [expr {0x66000000 + (0x200000 * $coreid) + $_SOCKET_OFFSET + $_APB_OFFSET}]
		set _dbg_offset_t0 0x90000
		set _cti_offset_t0 0xf0000
		set _t1_offset 0x80000

		foreach _thread {0 1} {
			if { $_thread == 0 } {
				set _cti_addr [expr {$_core_offset + $_cti_offset_t0}]
				set _dbg_addr [expr {$_core_offset + $_dbg_offset_t0}]
			} else {
				set _cti_addr [expr {$_core_offset + $_cti_offset_t0 + $_t1_offset}]
				set _dbg_addr [expr {$_core_offset + $_dbg_offset_t0 + $_t1_offset}]
			}
			set _abs_thread [expr {$_CURRENT_CORE*2+$_thread}]

			# Create and configure Cross Trigger Interface (CTI) - required for halt and resume
			cti create ${_CTINAME}t${_thread} -mem-ap $_APBBUSTGT -baseaddr $_cti_addr

			# Create the target
			target create ${_CORENAME}t${_thread} aarch64 \
				-mem-ap $_APBBUSTGT -dbgbase $_dbg_addr \
				-cti ${_CTINAME}t${_thread} -coreid $_abs_thread -rtos hwthread \
				-auto-detect

			if { $POWER_UP_DEBUG != 0 } {
				# Set PR bit in debug block and cluster ROM tables
				# Power controls are not thread specific but do it for both in case
				# thread 1 is examined first.
				# We disable all messages to avoid too many errors and just output
				# a simple info message.
				set last_level_var "\$last_level"
				${_CORENAME}t${_thread} configure -event examine-start [subst -nobackslashes -nocommands {
					regsub {.*debug_level: (-*\d+).*} "[debug_level]" {\1} last_level
					try {
						debug_level -3
						$_APBBUSTGT write_memory [expr {$_core_offset + 0xa00}] 32 3
						$_APBBUSTGT write_memory [expr {$_core_offset + 0x10000 + 0xa00}] 32 3
						debug_level $last_level_var
						after 1
					} on error {} {
						debug_level $last_level_var
						echo "Unable to power on ${_CORENAME}t${_thread}, core may not exist or CCPLEX is off."
					}
				}]
			}

			# Clear CTI output/input enables that are not configured by OpenOCD for aarch64
			${_CORENAME}t${_thread} configure -event reset-init [subst {
				${_CTINAME}t${_thread} write INEN0 0x00000000
				${_CTINAME}t${_thread} write INEN1 0x00000000
				${_CTINAME}t${_thread} write INEN2 0x00000000
				${_CTINAME}t${_thread} write INEN3 0x00000000
				${_CTINAME}t${_thread} write INEN4 0x00000000
				${_CTINAME}t${_thread} write INEN5 0x00000000
				${_CTINAME}t${_thread} write INEN6 0x00000000
				${_CTINAME}t${_thread} write INEN7 0x00000000
				${_CTINAME}t${_thread} write INEN8 0x00000000

				${_CTINAME}t${_thread} write OUTEN0 0x00000000
				${_CTINAME}t${_thread} write OUTEN1 0x00000000
				${_CTINAME}t${_thread} write OUTEN2 0x00000000
				${_CTINAME}t${_thread} write OUTEN3 0x00000000
				${_CTINAME}t${_thread} write OUTEN4 0x00000000
				${_CTINAME}t${_thread} write OUTEN5 0x00000000
				${_CTINAME}t${_thread} write OUTEN6 0x00000000
				${_CTINAME}t${_thread} write OUTEN7 0x00000000
				${_CTINAME}t${_thread} write OUTEN8 0x00000000
			}]

			# Build string used to enable SMP mode for the ARMv8 CPU cores
			lappend CCPLEX_CORES_LIST "${_CORENAME}t${_thread}"
		}
		echo "Core $_CURRENT_CORE config created."
		incr _CURRENT_CORE
	}

	echo "Vera chiplet $chiplet_id configuration done.\n"
}

# Configure OpenOCD to debug a Vera based board
proc vera_board_configure { num_chiplets } {
	global GDB_FIRST_PORT
	global CCPLEX_CORES_LIST

	#
	# Configure Resets
	#
	reset_config none

	#
	# Configure Vera chips
	#
	for {set chipletid 0} {$chipletid < $num_chiplets} {incr chipletid} {
		vera_instantiate $chipletid
	}

	# Set the gdb port and allow connections
	# from any machine that can reach the platform running OpenOCD
	gdb_port $GDB_FIRST_PORT
	bindto 0.0.0.0

	# Defined in the global scope of this file
	# Configure SMP
	eval "target smp $CCPLEX_CORES_LIST"
}

# This function should be called once all cores have been configured, it
# will run init, check the config looks sane and prepare for attach.
proc vera_board_init {} {
	if { [is_shutdown_pending] } {
		echo "OpenOCD is shutting down, skipping board initialization."
		noinit
		return
	}
	global WDT_FREEZE_REGS

	# Run init
	init

	# Now that we can access the buses, double check config is sane
	check_apb_config

	# Freeze every socket's watchdog so a halted core can't let the WDT reset the
	# SOC. Each entry is {socket axi-target freeze-addr} — a USE_C2C=0 chiplet uses
	# its own AXI-AP, C2C sockets use socket 0's. Examine the AP first (may be deferred).
	foreach _reg $WDT_FREEZE_REGS {
		set _socket [lindex $_reg 0]
		set _axi    [lindex $_reg 1]
		set _addr   [lindex $_reg 2]
		catch { $_axi arp_examine }
		if { [catch { $_axi mww $_addr 0x1 } _werr] } {
			echo "socket $_socket: WARNING: could not disable watchdogs: $_werr"
		} else {
			echo "socket $_socket: all watchdogs disabled"
		}
	}

	# Enable SMP for GDB connections
	aarch64 smp on
}

# Called if OpenOCD found an issue with a TAP, tries to give some useful
# feedback to the operator about what might be wrong.
proc check_tap_config { tap } {
	global VERATAPID
	global SYSNAME
	global BOARD_NAME
	global STRAPS_DIESEL
	global GPIO_BYPASS

	regexp [subst -nobackslashes -nocommands {^${BOARD_NAME}\.\d+\.([a-z]+\d*)\.armjtag$}] $tap _VALID_TAP_NAME _DIELET_T
	if { ! [info exists _VALID_TAP_NAME] } {
		error "TAP name $tap not recognized."
	} elseif { ($_DIELET_T == "c") } {
		set _DIELET_TYPE "compute"
	} elseif { ($_DIELET_T == "s") } {
		set _DIELET_TYPE "system"
	} elseif { [string match {m[0-9]} $_DIELET_T] } {
		set _DIELET_TYPE "memory"
	} else {
		error "Unknown dielet type $_DIELET_T for TAP $tap."
	}
	set _TAP_SIG [jtag cget $tap -idcode]
	if { $_TAP_SIG == $VERATAPID } {
		echo "OpenOCD TAP $tap is attached to a Vera $_DIELET_TYPE dielet."
	} else {
		echo "ERROR ================================================="
		echo "ERROR OpenOCD TAP $tap signature is not recognized ($_TAP_SIG)!"
		if { $_TAP_SIG == 0xFFFFFFFF } {
			echo "ERROR The JTAG chain configuration does not match what"
			echo "ERROR is expected by OpenOCD, check your board"
			echo "ERROR configuration and if applicable set"
			echo "ERROR STRAPS_DIESEL and GPIO_BYPASS appropriately."
			echo "ERROR Currently we have:"
			if { [ info exists STRAPS_DIESEL ] } {
				echo "ERROR STRAPS_DIESEL=${STRAPS_DIESEL} (change by adding -c 'set STRAPS_DIESEL <v>' on command line)"
			}
			if { [ info exists GPIO_BYPASS ] } {
				echo "ERROR GPIO_BYPASS=${GPIO_BYPASS} (change by adding -c 'set GPIO_BYPASS <v>' on command line)"
			}
		} elseif { $_TAP_SIG == 0 } {
			echo "ERROR Check system is ON and that the board"
			echo "ERROR is a $BOARD_NAME board."
		} else {
			echo "ERROR Try reducing clock speed and check that the board"
			echo "ERROR is a $BOARD_NAME board."
		}
		echo "ERROR ================================================="
		error "TAP $tap configuration error."
	}
}

# Helper function for check_apb_config called if we suspect a problem. This
# function tries to figure out what is wrong based on what was discovered.
proc analyze_tap_config {} {
	global VERATAPID
	global SYSNAME
	global BOARD_NAME
	global STRAPS_DIESEL
	global GPIO_BYPASS

	set _TAPS_LIST [jtag names]

	# First scan for undiscovered taps
	set _UNEXPECTED_VERA_TAPS {}
	set _VERA_TAPS {}
	set _BAD_VERA_TAPS {}
	set _UNKNOWN_TAPS {}
	set _EXPECTED_CHIPLETS 0
	set _EXPECTED_SYSTEM_DIELETS 0
	set _EXPECTED_COMPUTE_DIELETS 0
	set _FOUND_CHIPLETS 0
	set _FOUND_SYSTEM_DIELETS 0
	set _FOUND_COMPUTE_DIELETS 0
	foreach tap $_TAPS_LIST {
		if { [regexp {^.*\.([0-9]+)\.([a-z0-9]+)\.armjtag$} $tap _TAP_TEMP _TAP_CHIPLET _TAP_DIELET_T] } {
			# Detect how many chiplets we have
			if { $_TAP_CHIPLET >= $_EXPECTED_CHIPLETS } {
				set _EXPECTED_CHIPLETS [expr {$_TAP_CHIPLET+1}]
			}
			# Check for the dielets that matter
			if { $_TAP_DIELET_T == "c" } {
				set _EXPECTED_COMPUTE_DIELETS [expr {$_EXPECTED_COMPUTE_DIELETS+1}]
			} elseif { $_TAP_DIELET_T == "s" } {
				set _EXPECTED_SYSTEM_DIELETS [expr {$_EXPECTED_SYSTEM_DIELETS+1}]
			}
			if { [jtag cget $tap -idcode] != $VERATAPID } {
				lappend _BAD_VERA_TAPS $tap
			} else {
				lappend _VERA_TAPS $tap
				# Detect how many chiplets we have
				if { $_TAP_CHIPLET >= $_FOUND_CHIPLETS } {
					set _FOUND_CHIPLETS [expr {$_TAP_CHIPLET+1}]
				}
				# Check for the dielets that matter
				if { $_TAP_DIELET_T == "c" } {
					set _FOUND_COMPUTE_DIELETS [expr {$_FOUND_COMPUTE_DIELETS+1}]
				} elseif { $_TAP_DIELET_T == "s" } {
					set _FOUND_SYSTEM_DIELETS [expr {$_FOUND_SYSTEM_DIELETS+1}]
				}
			}
		} else {
			if { [jtag cget $tap -idcode] == $VERATAPID } {
				lappend _UNEXPECTED_VERA_TAPS $tap
			} else {
				lappend _UNKNOWN_TAPS $tap
			}
		}
	}
	# Now that we have gathered the data, look at them and try to figure out what
	# went wrong using the common cases.
	echo "Found [llength $_VERA_TAPS] valid Vera taps, [llength $_UNEXPECTED_VERA_TAPS] unexpected taps and [llength $_BAD_VERA_TAPS] with a bad IDCODE."
	echo "Found [llength $_UNKNOWN_TAPS] unknown taps."
	echo "Found $_FOUND_CHIPLETS configured chiplets, expected $_EXPECTED_CHIPLETS."
	echo "Found $_FOUND_SYSTEM_DIELETS configured system dielets, expected $_EXPECTED_SYSTEM_DIELETS."
	echo "Found $_FOUND_COMPUTE_DIELETS configured compute dielets, expected $_EXPECTED_COMPUTE_DIELETS."
	if { ([llength $_UNEXPECTED_VERA_TAPS] == 0) && ([llength $_BAD_VERA_TAPS] == 0)
			&& ($_FOUND_SYSTEM_DIELETS == $_EXPECTED_CHIPLETS) } {
		echo "TAPs configuration looks GOOD"
		return
	}
	echo "ERROR ================================================="
	if { $_FOUND_CHIPLETS != $_EXPECTED_CHIPLETS } {
		echo "ERROR Expected $_EXPECTED_CHIPLETS chiplets, found $_FOUND_CHIPLETS, check your"
		echo "ERROR GPIOSEL setting (adjust with -c 'set GPIOSEL <value>')"
	} elseif { $_FOUND_SYSTEM_DIELETS != $_EXPECTED_SYSTEM_DIELETS } {
		echo "ERROR Expected $_EXPECTED_SYSTEM_DIELETS system dielets, found $_FOUND_SYSTEM_DIELETS, check your"
		echo "ERROR GPIOSEL setting (adjust with -c 'set GPIOSEL <value>')"
	} elseif { $_FOUND_COMPUTE_DIELETS != $_EXPECTED_COMPUTE_DIELETS } {
		echo "ERROR Expected $_EXPECTED_COMPUTE_DIELETS compute dielets, found $_FOUND_COMPUTE_DIELETS, check your"
		echo "ERROR GPIOSEL setting (adjust with -c 'set GPIOSEL <value>')"
	} elseif { ([llength $_UNEXPECTED_VERA_TAPS] == [expr {4*$_FOUND_CHIPLETS}]) && ($STRAPS_DIESEL == 0) } {
		echo "ERROR STRAPS_DIESEL is set to 0 but it appears it is 7 on the board,"
		echo "ERROR re-run with STRAPS_DIESEL=7 (add -c 'set STRAPS_DIESEL 7'"
		echo "ERROR to OpenOCD's command line)"
	} else {
		echo "ERROR invalid configuration check your STRAPS_DIESEL and GPIOSEL"
		echo "ERROR configuration."
	}
	echo "ERROR ================================================="
	shutdown error
}

# Check each APB connection to make sure we are connected to what we
# think we are in a Vera chiplet.
proc check_apb_config { } {
	global VERATAPID
	global SYSNAME
	global BOARD_NAME

	# Note: we assume here that the TAPs have all been recognized properly
	# thus DAPs are Vera DAPs.
	set SYSTEM_DIE_APB_FOUND 0
	set COMPUTE_DIE_APB_FOUND 0

	set apb_targets {}
	set axi_targets {}
	foreach item [targets] {
		if {[lsearch -glob $item *.apb] != -1} {
			lappend apb_targets $item
		} elseif {[lsearch -glob $item *.axi] != -1} {
			lappend axi_targets $item
		}
	}

	foreach apb $apb_targets {
		# Per 6.1.19.11 in DFD IAS APB registers part_number[4:2] in PIDR0
		# and PIDR1 of APBROM can be used to detect which Vera dielet we are
		# attached to.
		# S = 101b, C=000b, M0=001b, M1=010b, M2=011b, M3=100b.
		set _APBROM_PIDR0 [ $apb read_memory 0x800fe0 32 1 ]
		set _APBROM_PIDR1 [ $apb read_memory 0x800fe4 32 1 ]
		set _PID [expr { (($_APBROM_PIDR1 & 0xf)<<8) | ($_APBROM_PIDR0 & 0xff) }]
		set _DIELET_IDX [expr { ($_PID >> 2) & 7 }]
		set _CHIPLET_IDX [expr { $_PID & 3 }]
		echo "$apb APBROM Part Numer: [format "0x%x" $_PID]"
		if { $_DIELET_IDX == 0 } {
			set _DIELET_TYPE "compute"
			set COMPUTE_DIE_APB_FOUND 1
		} elseif { $_DIELET_IDX == 1 } {
			set _DIELET_TYPE "memory1"
		} elseif { $_DIELET_IDX == 2 } {
			set _DIELET_TYPE "memory2"
		} elseif { $_DIELET_IDX == 3 } {
			set _DIELET_TYPE "memory3"
		} elseif { $_DIELET_IDX == 4 } {
			set _DIELET_TYPE "memory4"
		} elseif { $_DIELET_IDX == 5 } {
			set _DIELET_TYPE "system"
			set SYSTEM_DIE_APB_FOUND 1
		} else {
			error "Invalid APBROM Part Number [format "0x%x" $_PID] for APB port $apb, dielet type not recognized."
		}
		if { $_CHIPLET_IDX > 1 } {
			error "Invalid APBROM Part Number [format "0x%x" $_PID] for APB port $apb, chiplet index not recognized."
		}
		regexp {.*\.([0-9]+)\.apb} $apb _REGEXP_MATCH _EXPECTED_CHIPLET_IDX
		if { [info exists _EXPECTED_CHIPLET_IDX] } {
			if { $_EXPECTED_CHIPLET_IDX != $_CHIPLET_IDX } {
				error "$apb should be attached to chiplet $_EXPECTED_CHIPLET_IDX but attached to chiplet $_CHIPLET_IDX instead."
			}
		}
		echo "$apb: chiplet $_CHIPLET_IDX $_DIELET_TYPE dielet"
		if { [ $apb was_examined ] == 0 } {
			error "$apb could not be started properly, target cannot be debugged."
		}
	}
	if { $SYSTEM_DIE_APB_FOUND == 0 } {
		if { [transport select] eq "cswp" } {
			error "CSWP server is not working properly"
		} elseif { $COMPUTE_DIE_APB_FOUND != 0 } {
				error "Found a compute dielet but no system dielet, is your JTAG dongle attached to the right port?"
		} else {
			# If JTAG is selected attempt to figure what's up by scanning the TAPs
			analyze_tap_config
			error "None of the APB bus found is attached to a system dielet, check your board configuration."
		}
	}
	# Now check that the AXI buses could be configured properly, otherwise
	# debug is unlikely to work (it might be possible with just chiplet 0 axi
	# in some limited way but the failure won't be obvious).
	foreach axi $axi_targets {
		if { [ $axi was_examined ] == 0 } {
			error "$axi could not be started properly, target cannot be debugged."
		}
	}
	echo "OpenOCD attached to a valid ${BOARD_NAME} board."
}

# Helper function
proc jtag_instantiate_tap { tap_basename id } {
	jtag newtap $tap_basename armjtag -irlen 4 -expected-id $id
	# If a setup-error happened we always fail.
	jtag configure $tap_basename.armjtag -event setup-error [subst {
		try {
			check_tap_config $tap_basename.armjtag
		} finally {
			# A TAP setup-error is always fatal
			echo "ERROR: failed to configure $tap_basename.armjtag."
			shutdown error
		}
	}]
	# If scanchain was setup properly we can still fail
	jtag configure $tap_basename.armjtag -event setup [subst {
		try {
			check_tap_config $tap_basename.armjtag
		} on error {msg} {
			echo "ERROR: failed to configure $tap_basename.armjtag: \$msg"
			# A TAP config error during configure is fatal
			shutdown error
		}
	}]
}

# Instantiate the JTAG TAP chain for one Vera chiplet
proc jtag_instantiate { die_type chiplet_id die_sel } {
	global VERATAPID
	global BOARD_NAME

	if { $die_type == "system" } {
		# The S die contains JTAG ports for M1-M4 and S, which are attached
		# depends on DIE_SEL straps:
		if { $die_sel == 7 } {
			jtag_instantiate_tap $BOARD_NAME.$chiplet_id.m1 $VERATAPID
			jtag_instantiate_tap $BOARD_NAME.$chiplet_id.m2 $VERATAPID
			jtag_instantiate_tap $BOARD_NAME.$chiplet_id.m3 $VERATAPID
			jtag_instantiate_tap $BOARD_NAME.$chiplet_id.m4 $VERATAPID
			jtag_instantiate_tap $BOARD_NAME.$chiplet_id.s $VERATAPID
		} elseif { $die_sel == 0 } {
			jtag_instantiate_tap $BOARD_NAME.$chiplet_id.s $VERATAPID
		} else {
			error "DIE_SEL value of $die_sel for chiplet $chiplet_id dielet $die_type is not supported."
		}
		dap create $BOARD_NAME.$chiplet_id.s.dap -chain-position $BOARD_NAME.$chiplet_id.s.armjtag -adiv6 -ignore-syspwrupack
	} elseif { $die_type == "compute" } {
		jtag_instantiate_tap $BOARD_NAME.$chiplet_id.c $VERATAPID
		dap create $BOARD_NAME.$chiplet_id.c.dap -chain-position $BOARD_NAME.$chiplet_id.c.armjtag -adiv6 -ignore-syspwrupack
	} else {
		error "Unknown dielet type $die_type for chiplet $chiplet_id."
	}
	echo "TAP chain configured for Chiplet $chiplet_id dielet $die_type (die_sel value of $die_sel)."
}

# Sets up JTAG, should be called from board file if JTAG is the connection
# pipe chosen.
proc jtag_basic_init { board_default_speed } {
	global JTAGFREQ
	global JTAG_ADAPTER_SERIAL

	if { ! [ info exists JTAGFREQ ] } {
		set JTAGFREQ $board_default_speed
	}

	# No SWD on Grace
	transport select jtag
	puts "Using adapter driver [adapter name]"
	if { [adapter name] eq "ftdi" } {
		ftdi tdo_sample_edge falling
	}

	# If applicable select which JTAG dongle to target based on serial:
	if { [info exists JTAG_ADAPTER_SERIAL] } {
		adapter serial "$JTAG_ADAPTER_SERIAL"
	}

	#
	# Configure JTAG speed
	#
	adapter speed $JTAGFREQ
	jtag_ntrst_delay 100
}

################
# UTILITY FUNCTIONS: these are there to customize the Vera framework
# behavior based on user preferences.
################

# This function is a post-init hook that can be called to change whether
# cores should be halted when GDB attaches
proc nonstop-attach { on } {
	global GDB_FIRST_PORT
	global CCPLEX_CORES_LIST

	if { "$on" eq "on" } {
		foreach core $CCPLEX_CORES_LIST {
			$core configure -event gdb-attach {}
		}
		echo "Target will not stop when GDB attaches"
	} elseif { "$on" eq "off" } {
		foreach core $CCPLEX_CORES_LIST {
			$core configure -event gdb-attach { halt 1000 }
		}
		echo "Target will stop when GDB attaches"
	} else {
		error "ERROR: invalid argument to nonstop-attach: $on"
	}
}

